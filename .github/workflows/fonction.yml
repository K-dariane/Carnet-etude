# Déploie la fonction serveur « chat » sur Supabase (projet xyrlifukufcntwinrtvz) quand son code change sur main.
# Les tests du serveur passent d'abord ; s'ils échouent, rien n'est déployé.
# Prérequis (une seule fois) : secret GitHub SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions),
# créé dans Supabase → Account → Access Tokens.
name: Déploiement de la fonction chat

on:
  push:
    branches: [main]
    paths: ["app-etude/web/supabase/**", ".github/workflows/fonction.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonction-chat
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    # Base de test dédiée, même version majeure que Supabase : les tests ne dépendent pas de la version
    # installée sur la machine GitHub (elle est passée de 16 à 18 sans prévenir).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: app-etude/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:serveur

  deploiement:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le jeton Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant : ajoute-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Déployer la fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.121.0 functions deploy chat --project-ref xyrlifukufcntwinrtvz --no-verify-jwt --use-api --workdir app-etude/web
